<style>
:root{--bg1:#fcfdff;--bg2:#f4f7ff;--bg3:#eef2ff;--card:rgba(255,255,255,0.92);--border:rgba(255,255,255,0.95);--text:#1e2a44;--muted:#7a8ab0;--soft:#e2e8ff;--blue:#7bb2f4;--blue2:#5a8de0;--shadow:0 8px 32px rgba(31,38,135,0.06);--deep:0 20px 50px rgba(31,38,135,0.10)}
.dark{--bg1:#0f1424;--bg2:#151f38;--bg3:#1a2442;--card:rgba(30,42,74,0.92);--border:rgba(42,54,92,0.8);--text:#d6e2ff;--muted:#8aa0c8;--soft:#2a365c;--shadow:0 8px 32px rgba(0,0,0,0.35);--deep:0 20px 50px rgba(0,0,0,0.5)}
*{box-sizing:border-box} body{font-family:'Outfit','Inter',sans-serif; background:radial-gradient(1200px 600px at 50% -10%, #fff 0%, var(--bg1) 20%, var(--bg2) 60%, var(--bg3) 100%); min-height:100vh; margin:0; padding:16px; color:var(--text); transition:.4s; -webkit-font-smoothing:antialiased}
.dark body{background:radial-gradient(900px 500px at 50% -10%, #1f2c52 0%, var(--bg1) 40%, var(--bg3) 100%)}
.container{max-width:460px; margin:auto; background:var(--card); backdrop-filter:blur(20px) saturate(1.2); border:1px solid var(--border); border-radius:28px; padding:18px; box-shadow:var(--deep); transform-style:preserve-3d; transition:transform .15s ease}
.header{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px}
.brand{display:flex; align-items:center; gap:12px} .logo{width:54px; height:54px; border-radius:14px; background:#fff; box-shadow:0 8px 18px rgba(0,0,0,.13), inset 0 1px 0 #fff; overflow:hidden; display:grid; place-items:center} .logo img{width:100%; height:100%; object-fit:cover}
.brand h3{margin:0; font-size:20px; font-weight:800; letter-spacing:-.02em} .small{font-size:11px; color:var(--muted); font-weight:700}
.toggle{width:50px; height:30px; background:var(--soft); border-radius:999px; position:relative; cursor:pointer; border:1px solid rgba(0,0,0,.06); box-shadow:inset 0 2px 4px rgba(0,0,0,.06)} .knob{width:24px; height:24px; background:#fff; border-radius:50%; position:absolute; top:2px; left:2px; transition:.38s cubic-bezier(.34,1.56,.64,1); box-shadow:0 2px 8px rgba(0,0,0,.18); display:grid; place-items:center; font-size:12px} .dark .knob{transform:translateX(20px)}
label{font-size:10px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:12px 2px 5px; display:block}
select,input{width:100%; padding:13px 14px; border-radius:14px; border:1px solid var(--soft); background:rgba(255,255,255,.85); font-size:15px; font-family:inherit; color:var(--text); box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 2px 8px rgba(31,38,135,.04); outline:none; transition:.2s}
.dark select,.dark input{background:rgba(21,31,56,.9); border-color:#2a365c}
select:focus,input:focus{border-color:var(--blue); box-shadow:0 0 0 4px rgba(123,178,244,.2)}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.btn{border:none; font-weight:800; border-radius:14px; padding:13px; cursor:pointer; transition:.15s; box-shadow:0 6px 0 rgba(0,0,0,.13), 0 8px 16px rgba(0,0,0,.1)} .btn:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.13)}
.btn-add{background:linear-gradient(180deg,#2ee89e,#2ecc71 55%, #27ae60); color:#fff; grid-column:span 2}
.btn-print{background:linear-gradient(180deg,#8bbcff,#7bb2f4 50%, #5a8de0); color:#fff}
.btn-reset{background:linear-gradient(180deg,#ffe0e0,#ffb4b4); color:#7a1f1f; box-shadow:0 4px 0 rgba(122,31,31,.18), 0 6px 12px rgba(0,0,0,.06)}
.table-wrap{margin-top:16px; border-radius:18px; overflow:hidden; border:1px solid var(--soft); background:rgba(255,255,255,.6); box-shadow:var(--shadow)} .dark .table-wrap{background:rgba(21,31,56,.6)}
table{width:100%; border-collapse:collapse} th{font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); padding:10px 8px; background:rgba(238,242,255,.8); border-bottom:1px solid var(--soft)} .dark th{background:rgba(42,54,92,.5)} td{padding:10px 8px; font-size:13px; text-align:center; border-bottom:1px solid rgba(226,232,255,.6); font-weight:700} .dark td{border-color:rgba(42,54,92,.35)} tr{animation:slide .3s ease} @keyframes slide{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
.del{background:#ff4d4d; color:#fff; border:none; width:28px; height:28px; border-radius:50%; font-weight:800; cursor:pointer; box-shadow:0 3px 0 #c73636, 0 4px 8px rgba(0,0,0,.15)}
.total{display:flex; justify-content:space-between; padding:6px 0; font-weight:700; font-size:13px} .grand{font-size:18px; background:linear-gradient(180deg,#f6f8ff,#eef4ff); border:1px solid #fff; padding:12px 14px; border-radius:14px; margin-top:8px; box-shadow:inset 0 1px 0 #fff, 0 6px 16px rgba(90,110,170,.1)} .dark .grand{background:linear-gradient(180deg,#232f55,#1e2a4a); border-color:#2a365c}
.print-text{display:none; font-weight:800; font-size:14px; margin:4px 0}

<script>
const prices={"Trouser":{L:127000,W:135000,P:104000},"Shirt (Long Sleeve)":{L:127000,W:135000,P:104000},"Shirt (Short Sleeve)":{L:115000,W:116000,P:104000},"Sport Shirt":{L:105000,W:105000,P:93000},"Under pants":{L:64000},"Undershirt":{L:64000},"Necktie":{W:80000,P:70000},"Blouse":{L:127000,W:138000,P:93000},"Dress":{L:127000,W:200000,P:121000},"Skirt":{L:110000,W:150000,P:93000},"Slack":{L:127000,W:139000,P:104000},"Brassieres":{L:64000},"Panties":{L:64000},"Suit (2pcs)":{W:230000,P:195500},"Sweater":{L:110000,W:120000,P:93000},"Pyjamas (2pcs)":{L:93000,W:92000,P:75000},"T'Shirt":{L:93000,W:100000,P:85000},"Socks":{L:63000},"Shorts":{L:81000,W:80000,P:75000},"Jeans":{L:127000,W:138000,P:99000},"Jacket":{L:130000,W:145000,P:120000},"Handkerchief":{L:58000},"Scarf/Hijab/Apron/Hat":{L:60500,W:70000,P:55000},"Blanket/Bath Towel":{L:110000},"Sarung":{L:121000,W:130000,P:110000},"Open Hand Towel":{L:81000},"Open Bed Sheet":{L:110000},"Open Face Towel/Pillow Cases":{L:58000},"Open Mask/Cadar/Celemek":{L:58000},"Open Large Doll":{L:140000},"Open Medium Doll":{L:93000},"Open Small Doll":{L:63000},"Open Handband":{L:63000},"Open Vest":{L:110000,W:123000,P:93000},"Open Baby Bouncer":{L:81000}};
let grandTotal=0,totalPieces=0,totalEntries=0;
function updateDateTime(){document.getElementById('datetime').innerText=new Date().toLocaleString('id-ID',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})} setInterval(updateDateTime,1000); updateDateTime();
let itemSelect=document.getElementById('item'); itemSelect.innerHTML='<option value="">-- Pilih Item --</option>'; for(let item in prices){let opt=document.createElement("option"); opt.value=item; opt.text=item; itemSelect.appendChild(opt);}
function syncPrintText(){let v=document.getElementById('roomNo').value; document.getElementById('p-room').innerText="Room No. : "+(v?v:"-");}
function tampilPesan(t){document.getElementById('modalMsg').innerText=t; document.getElementById('myModal').style.display='block';} function closeModal(){document.getElementById('myModal').style.display='none';}
function tambah(){let item=document.getElementById('item').value; let service=document.getElementById('service').value; let qty=parseInt(document.getElementById('qty').value,10); let typeSelect=document.getElementById('type'); let itemDiscPercent=parseInt(document.getElementById('itemDisc').value); let mult=parseFloat(typeSelect.value); let typeName=typeSelect.options[typeSelect.selectedIndex].text; if(!item||!qty||isNaN(qty)){tampilPesan("Pilih item dan isi qty"); return;} if(!prices[item]||!prices[item][service]){tampilPesan("Service tidak tersedia untuk item ini"); return;} let base=prices[item][service]; let raw=base*qty*mult; let disc=raw*(itemDiscPercent/100); let total=raw-disc; grandTotal+=total; totalPieces+=qty; totalEntries+=1; let tbody=document.querySelector("#table tbody"); let tr=document.createElement("tr"); let disp=item+(itemDiscPercent>0?` (${itemDiscPercent}% Off)`:""); tr.innerHTML=`<td>${disp}</td><td>${service}</td><td>${typeName}</td><td>${qty}</td><td>${total.toLocaleString('id-ID')}</td><td class="no-print"><button class="del" onclick="hapusRow(this,${total},${qty})">×</button></td>`; tbody.appendChild(tr); updateTotal(); document.getElementById('qty').value=''; document.getElementById('itemDisc').value='0';}
function hapusRow(btn,total,qty){btn.parentElement.parentElement.remove(); grandTotal-=total; totalPieces-=qty; totalEntries-=1; updateTotal();}
function updateTotal(){let sub=grandTotal; let check=parseInt(document.getElementById('checkDisc').value); let checkAmt=sub*(check/100); let after=sub-checkAmt; let tax=after*0.21; let grand=Math.round((after+tax)/1000)*1000; document.getElementById('pieces').innerText=totalPieces; document.getElementById('entries').innerText=totalEntries; document.getElementById('total').innerText=sub.toLocaleString('id-ID'); let discRow=document.getElementById('p-disc-row'); let netRow=document.getElementById('p-net-row'); let pCheck=document.getElementById('p-checkdisc'); if(check>0){discRow.style.display='flex'; netRow.style.display='flex'; document.getElementById('discAmtText').innerText=checkAmt.toLocaleString('id-ID'); document.getElementById('netTotalText').innerText=after.toLocaleString('id-ID'); pCheck.innerText=`Check Disc. : ${check}%`; pCheck.style.display='block';} else {discRow.style.display='none'; netRow.style.display='none'; pCheck.style.display='none';} document.getElementById('tax').innerText=Math.round(tax).toLocaleString('id-ID'); document.getElementById('grand').innerText=grand.toLocaleString('id-ID');}
function printStruk(){if(totalEntries===0){tampilPesan("Tabel masih kosong, masukkan data terlebih dahulu."); return;} window.print();}
function resetAll(){document.querySelector("#table tbody").innerHTML=''; document.getElementById('roomNo').value=''; document.getElementById('checkDisc').value='0'; document.getElementById('itemDisc').value='0'; document.getElementById('p-checkdisc').style.display='none'; syncPrintText(); grandTotal=0; totalPieces=0; totalEntries=0; updateTotal();}
document.addEventListener("keydown",e=>{if(e.key==="Enter") tambah();});
function toggleDark(){document.documentElement.classList.toggle('dark'); document.body.classList.toggle('dark'); let isDark=document.documentElement.classList.contains('dark'); localStorage.setItem('laundry-dark',isDark); document.getElementById('knob').innerText=isDark?'☀️':'🌙';}
(function(){let s=localStorage.getItem('laundry-dark'); if(s==='true'){document.documentElement.classList.add('dark'); document.body.classList.add('dark'); document.getElementById('knob').innerText='☀️';}})();
const mainCard=document.getElementById('mainCard'); document.addEventListener('mousemove',e=>{let x=(e.clientX/window.innerWidth-0.5)*10; let y=(e.clientY/window.innerHeight-0.5)*10; mainCard.style.transform=`perspective(1000px) rotateY(${x*0.3}deg) rotateX(${-y*0.3}deg)`;});
</script>
</body>
</html>
